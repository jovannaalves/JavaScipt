<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação e Interação cpm JS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Cadastro Simples</h1>

        <form id="cadastroForm">
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required oninput="validarCadastro()">
                <p id="mensagemErro" class="mensagem-status"></p>

                <label for="password">Senha:</label>
                <input type="password" id="password" name="password"required oninput="validarCadastro()">

                <label for="passwordConfirmation">Confirmar Senha:</label>
                <input type="password" id="password" name="password"required oninput="validarCadastro()">
                <p id="mensagemErroSenha" class="mensagem-status"></p>
            </div>
            
            <button type="submit" id="btnEnviar" disabled>Enviar Cadastro</button>
        </form>
    </div>
    
    <script src="scripit.js"></script>

</body>
</html>
